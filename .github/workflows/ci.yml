name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_15.0.app/Contents/Developer || sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
        
      - name: Show Xcode version
        run: xcodebuild -version
        
      - name: Build and Run tests
        run: |
          if [ -f "HexPal.xcodeproj/project.pbxproj" ] || [ -f "HEXPal.xcodeproj/project.pbxproj" ]; then
            xcodebuild test \
              -scheme HexPal \
              -destination 'platform=macOS,arch=x86_64' \
              -enableCodeCoverage YES \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty || true
          else
            echo "Xcode project not found. Skipping tests."
            echo "This is expected during pre-setup phase."
          fi

  lint:
    name: Code Quality Checks
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint || echo "SwiftLint installation failed. Skipping lint checks."
          fi
          
      - name: Run SwiftLint
        run: |
          if command -v swiftlint &> /dev/null && [ -f ".swiftlint.yml" ]; then
            swiftlint lint --strict || echo "SwiftLint found issues or project not ready."
          else
            echo "SwiftLint not configured yet. Skipping lint checks."
            echo "This is expected during pre-setup phase."
          fi
          
      - name: Check file sizes
        run: |
          echo "Checking Swift file sizes (400 line limit)..."
          find . -name "*.swift" -type f ! -path "./.git/*" ! -path "./build/*" ! -path "./DerivedData/*" | while read file; do
            lines=$(wc -l < "$file" | tr -d ' ')
            if [ "$lines" -gt 400 ]; then
              echo "❌ $file exceeds 400 lines ($lines lines)"
              exit 1
            else
              echo "✅ $file: $lines lines"
            fi
          done || echo "No Swift files found yet. This is expected during pre-setup phase."

  documentation:
    name: Documentation Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check required documentation files
        run: |
          echo "Checking required documentation files..."
          required_files=("README.md" "LICENSE" "CONTRIBUTING.md" "CODE_OF_CONDUCT.md")
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file is missing"
              exit 1
            fi
          done
          
      - name: Validate README links
        run: |
          echo "Checking README.md for broken internal links..."
          # Basic check - ensure docs/ references exist
          if grep -q "docs/" README.md; then
            echo "✅ README.md references documentation"
          fi
